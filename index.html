<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bientôt réunis 💕</title>
<style>

  /* ============================================= */
  /*  MODIFIE ICI LA DATE ET L'HEURE DES RETROUVAILLES */
  /*  Format : "AAAA-MM-JJTHH:MM:00"                */
  /* ============================================= */

</style>
</head>
<body>

<div class="card">
  <div class="heart">❤️</div>
  <div class="title">Temps restant avant de se revoir</div>

  <div class="units">
    <div class="unit">
      <div class="number" id="days">00</div>
      <div class="label">jours</div>
    </div>
    <div class="unit">
      <div class="number" id="hours">00</div>
      <div class="label">heures</div>
    </div>
    <div class="unit">
      <div class="number" id="minutes">00</div>
      <div class="label">minutes</div>
    </div>
    <div class="unit">
      <div class="number" id="seconds">00</div>
      <div class="label">secondes</div>
    </div>
  </div>

  <div class="message" id="message"></div>
</div>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #ffeef2, #ffe0e9);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    text-align: center;
    padding: 40px 30px;
  }
  .heart {
    font-size: 48px;
    animation: beat 1.4s ease-in-out infinite;
    margin-bottom: 8px;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(1); }
  }
  .title {
    font-size: 18px;
    color: #a3405c;
    margin-bottom: 32px;
    font-weight: 500;
  }
  .units {
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .unit {
    background: #fff;
    border-radius: 16px;
    padding: 20px 18px;
    min-width: 90px;
    box-shadow: 0 4px 14px rgba(214, 90, 130, 0.15);
  }
  .number {
    font-size: 40px;
    font-weight: 600;
    color: #d6567f;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 13px;
    color: #b5788f;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .message {
    margin-top: 28px;
    font-size: 20px;
    color: #a3405c;
    font-weight: 500;
  }
</style>

<script>

  // ============================================= 
  //  MODIFIE ICI LA DATE ET L'HEURE DES RETROUVAILLES 
  //  Format : "AAAA-MM-JJTHH:MM:00" 
  //  Exemple : 25 décembre 2026 à 18h00 -> "2026-12-25T18:00:00"
  // ============================================= 
  const dateRetrouvailles = new Date("2026-09-29T19:00:00");

  // Message affiché quand le compte à rebours est terminé
  const messageFinal = "On se revoit enfin ! 💕";

  function updateTimer() {
    const now = new Date();
    const diff = dateRetrouvailles - now;

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const messageEl = document.getElementById('message');

    if (diff <= 0) {
      daysEl.textContent = "00";
      hoursEl.textContent = "00";
      minutesEl.textContent = "00";
      secondsEl.textContent = "00";
      messageEl.textContent = messageFinal;
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    daysEl.textContent = days.toString().padStart(2, '0');
    hoursEl.textContent = hours.toString().padStart(2, '0');
    minutesEl.textContent = minutes.toString().padStart(2, '0');
    secondsEl.textContent = seconds.toString().padStart(2, '0');
    messageEl.textContent = "";
  }

  updateTimer();
  setInterval(updateTimer, 1000);
</script>

</body>
</html>
