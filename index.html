<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bientôt réunis 💕</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #ffeef2, #ffd6e2);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card { position: relative; z-index: 2; text-align: center; padding: 30px 20px; width: 100%; max-width: 560px; }
  .heart { font-size: 52px; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.18); } 40% { transform: scale(1); } }
  .names { color: #d6567f; font-size: 22px; font-weight: 600; margin: 6px 0 4px; }
  .title { font-size: 16px; color: #a3405c; margin-bottom: 28px; }
  .units { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .unit { background: #fff; border-radius: 18px; padding: 16px 12px; min-width: 80px; box-shadow: 0 4px 14px rgba(214,90,130,.18); }
  .number { font-size: 36px; font-weight: 600; color: #d6567f; font-variant-numeric: tabular-nums; }
  .label { font-size: 12px; color: #b5788f; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .track { position: relative; height: 10px; background: #fff; border-radius: 10px; margin: 44px 12px 8px; box-shadow: inset 0 1px 4px rgba(214,90,130,.2); }
  .fill { height: 100%; width: 0; border-radius: 10px; background: linear-gradient(90deg, #ff9fb8, #e0527d); transition: width 1s; }
  .train { position: absolute; top: -26px; left: 0; font-size: 22px; transform: translateX(-50%); transition: left 1s; }
  .ends { display: flex; justify-content: space-between; margin: 0 8px; font-size: 20px; }
  .percent { font-size: 13px; color: #b5788f; margin-top: 6px; }
  .message { margin-top: 26px; min-height: 48px; font-size: 17px; color: #a3405c; font-style: italic; transition: opacity .6s; }
  .float { position: fixed; bottom: -40px; z-index: 1; pointer-events: none; animation: rise linear forwards; }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
  @media (max-width: 480px) { .unit { min-width: 70px; padding: 12px 8px; } .number { font-size: 30px; } }
</style>
</head>
<body>

<div class="card">
  <div class="heart">❤️</div>
  <div class="names" id="names"></div>
  <div class="title">Temps restant avant de se revoir</div>

  <div class="units">
    <div class="unit"><div class="number" id="days">00</div><div class="label">jours</div></div>
    <div class="unit"><div class="number" id="hours">00</div><div class="label">heures</div></div>
    <div class="unit"><div class="number" id="minutes">00</div><div class="label">minutes</div></div>
    <div class="unit"><div class="number" id="seconds">00</div><div class="label">secondes</div></div>
  </div>

  <div class="track">
    <div class="train" id="train">🚄</div>
    <div class="fill" id="fill"></div>
  </div>
  <div class="ends"><span id="from">🏠</span><span id="to">🏠</span></div>
  <div class="percent" id="percent"></div>

  <div class="message" id="message"></div>
</div>

<script>
  // ==========================================================
  //  
  // ==========================================================

  // Date et heure des retrouvailles  (format "AAAA-MM-JJTHH:MM:00")
  const dateRetrouvailles = new Date("2026-10-27T22:00:00");

  // Date dernier au revoir
  const dateDepart = new Date("2026-10-04T19:52:00");

  // Prénoms
  const prenoms = "Loulou 💗 Milou";

  // Emojis aux deux bouts de la barre
  const emojiDepart = "🏠";
  const emojiArrivee = "🏡";

  // Messages doux qui changent toutes les 8 secondes
  const messages = [
    ""
  ];

  // Message quand le compte à rebours est fini
  const messageFinal = "On se revoit enfin ! 💕🎉";

  // ==========================================================

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const cute = ["My sweetie 💗","Je t'aime 💕","💖","🌸","✨","🤍"];

  $('names').textContent = prenoms;
  $('from').textContent = emojiDepart;
  $('to').textContent = emojiArrivee;

  function update() {
    const now = new Date();
    const diff = dateRetrouvailles - now;
    const total = dateRetrouvailles - dateDepart;
    const done = Math.min(100, Math.max(0, ((now - dateDepart) / total) * 100));

    $('fill').style.width = done + '%';
    $('train').style.left = done + '%';
    $('percent').textContent = Math.round(done) + '% du chemin parcouru';

    if (diff <= 0) {
      ['days','hours','minutes','seconds'].forEach(i => $(i).textContent = '00');
      $('message').textContent = messageFinal;
      $('percent').textContent = '100% du chemin parcouru 🎉';
      return;
    }
    $('days').textContent = pad(Math.floor(diff / 864e5));
    $('hours').textContent = pad(Math.floor(diff / 36e5) % 24);
    $('minutes').textContent = pad(Math.floor(diff / 6e4) % 60);
    $('seconds').textContent = pad(Math.floor(diff / 1e3) % 60);
  }

  // Messages qui tournent
  let m = 0;
  function nextMessage() {
    if (dateRetrouvailles - new Date() <= 0) return;
    const el = $('message');
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = messages[m++ % messages.length]; el.style.opacity = 1; }, 600);
  }

  // Petits cœurs qui montent
  function spawn() {
    const e = document.createElement('div');
    e.className = 'float';
    e.textContent = cute[Math.floor(Math.random() * cute.length)];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.fontSize = 14 + Math.random() * 22 + 'px';
    e.style.animationDuration = 6 + Math.random() * 6 + 's';
    e.style.opacity = 0.5 + Math.random() * 0.4;
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 12000);
  }

  update(); nextMessage();
  setInterval(update, 1000);
  setInterval(nextMessage, 8000);
  setInterval(spawn, 700);
</script>

</body>
</html>
