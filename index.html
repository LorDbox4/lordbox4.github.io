<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeux anniversaire 🎂</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; color: #7a2f49;
    background: linear-gradient(180deg, #ffeef2, #ffd6e2 60%, #ffe9d6);
    background-attachment: fixed;
    font-family: Georgia, "Times New Roman", serif;
  }
  .float { position: fixed; bottom: -40px; z-index: 0; pointer-events: none; animation: rise linear forwards; }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }

  /* Écran d'accueil */
  #cover {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: linear-gradient(180deg, #ffeef2, #ffd6e2); transition: opacity 1s, visibility 1s;
  }
  #cover.hide { opacity: 0; visibility: hidden; }
  .gift { font-size: 90px; cursor: pointer; animation: bounce 1.6s ease-in-out infinite; background: none; border: 0; }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
  #cover p { font-size: 20px; margin-top: 10px; }

  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 50px 20px 80px; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 6px; color: #d6567f; font-weight: normal; }
  .sub { font-style: italic; margin-bottom: 40px; }
  h2 { font-size: 24px; color: #d6567f; font-weight: normal; margin: 56px 0 18px; }
  .sep { font-size: 20px; letter-spacing: 8px; opacity: .6; }

  .letter {
    background: #fffaf6; border-radius: 14px; padding: 30px 26px; text-align: left; line-height: 1.8;
    font-size: 17px; box-shadow: 0 6px 20px rgba(214,90,130,.2); white-space: pre-line;
  }
  .sign { text-align: right; margin-top: 18px; font-style: italic; color: #d6567f; }

  .audio-card {
    background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 6px 20px rgba(214,90,130,.2);
  }
  .audio-card .note { font-size: 38px; margin-bottom: 6px; }
  audio { width: 100%; margin-top: 10px; }

  .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 22px; }
  .polaroid {
    background: #fff; padding: 10px 10px 14px; border-radius: 4px; box-shadow: 0 5px 16px rgba(0,0,0,.15);
    transition: transform .3s;
  }
  .polaroid:nth-child(odd) { transform: rotate(-3deg); }
  .polaroid:nth-child(even) { transform: rotate(3deg); }
  .polaroid:hover { transform: rotate(0) scale(1.05); }
  .polaroid .img {
    aspect-ratio: 1; background: #ffe3ea; border-radius: 2px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 40px;
  }
  .polaroid img { width: 100%; height: 100%; object-fit: cover; }
  .polaroid .cap { margin-top: 10px; font-size: 14px; font-style: italic; }

  .reasons { display: grid; gap: 12px; text-align: left; }
  .reason { background: #fff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 3px 10px rgba(214,90,130,.15); }

  .wish { margin-top: 60px; }
  button.surprise {
    border: 0; background: #d6567f; color: #fff; font-size: 18px; font-family: inherit;
    padding: 14px 30px; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 16px rgba(214,86,127,.4);
    transition: transform .15s;
  }
  button.surprise:active { transform: scale(.96); }
  #final { margin-top: 24px; font-size: 22px; min-height: 40px; color: #d6567f; }
</style>
</head>
<body>

<div id="cover">
  <button class="gift" id="giftBtn">🎁</button>
  <p>J’ai quelque chose pour toi…<br><small>(clique sur le cadeau)</small></p>
</div>

<main>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="sep">♥ ♥ ♥</div>

  <h2>Pour toi 💌</h2>
  <div class="letter">
    <span id="letter"></span>
    <div class="sign" id="sign"></div>
  </div>

  <h2>Écoute-moi 🎧</h2>
  <div class="audio-card">
    <div class="note">🎵</div>
    <div id="audioTitle"></div>
    <audio controls preload="metadata" id="audio"></audio>
  </div>

  <h2>Nos souvenirs 📸</h2>
  <div class="photos" id="photos"></div>

  <h2></h2>
  <div class="reasons" id="reasons"></div>

  <div class="wish">
    <button class="surprise" id="surpriseBtn">Fais un vœu 🎂</button>
    <div id="final"></div>
  </div>
</main>

<script>
  // ==========================================================
  //  ✏️ MODIFIE TOUT ICI
  // ==========================================================

  const prenom = "Loulou";                      
  const titre = "Joyeux anniversaireeeeeee";           // titre principal
  const sousTitre = "Aujourd’hui, c’est ton jour ✨";
  const signature = "Avec tout mon amour, Milou 💕";

  // Ta lettre (tu peux sauter des lignes normalement)
  const lettre = `Mon amour,
  
On dit que la lumière des étoiles met des années à nous parvenir.
Que ce qu’on regarde dans le ciel est parfois déjà du passé.
Moi, je crois que c’est l’inverse :
tu es la seule lumière qui arrive à traverser la distance
sans rien perdre de son éclat.

Au début je pensais que tu étais une étoile, éclatant de milles feux,
Mais je me rends compte maintenant que tu es finalement,
Un groupement d'étoiles, qui ne fait que briller de plus en plus,
Dont une étoile est ajoutée à chaque bougie.

Alors souffle, fais un vœu.
Et sache que le plus beau que je fasse chaque soir,
c’est celui de te retrouver.

Joyeux anniversaire mon amour 🌙

`;

  const audioFichier = "music.mp3";
  const audioTitre = "";

  const photos = [
    { src: "photos/photo1.jpg", legende: "Notre premier souvenir" },
    { src: "photos/photo2.jpg", legende: "Ce jour-là 🥰" },
    { src: "photos/photo3.jpg", legende: "Toi, tout simplement" },
  ];

  const raisons = [
    "Ton sourire illumine mes journées",
    "Tu es tellement radieuse, tous les jours",
    "Tu es tellement douce, gentille, attentionnée",
    "Mon ange"
  ];

  // Message après le vœu
  const messageVoeu = "Que tous tes vœux se réalisent 🎉 Je t’aime ❤️";

  // ==========================================================

  const $ = id => document.getElementById(id);
  const cute = ["💗","💕","💖","🌸","✨","🤍","🎈"];

  $('title').textContent = `${titre} ${prenom} 🎂`;
  $('sub').textContent = sousTitre;
  $('letter').textContent = lettre;
  $('sign').textContent = signature;
  $('audioTitle').textContent = audioTitre;
  $('audio').src = audioFichier;

  photos.forEach(p => {
    const d = document.createElement('div');
    d.className = 'polaroid';
    d.innerHTML = '<div class="img"><img alt=""></div><div class="cap"></div>';
    const img = d.querySelector('img');
    img.src = p.src;
    img.onerror = () => { img.parentNode.textContent = '📷'; };
    d.querySelector('.cap').textContent = p.legende;
    $('photos').appendChild(d);
  });

  raisons.forEach(r => {
    const d = document.createElement('div');
    d.className = 'reason';
    d.textContent = '💗 ' + r;
    $('reasons').appendChild(d);
  });

  function spawn(fast) {
    const e = document.createElement('div');
    e.className = 'float';
    e.textContent = cute[Math.floor(Math.random() * cute.length)];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.fontSize = 14 + Math.random() * 24 + 'px';
    e.style.animationDuration = (fast ? 3 : 6) + Math.random() * 5 + 's';
    e.style.opacity = 0.5 + Math.random() * 0.4;
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 12000);
  }

  $('giftBtn').addEventListener('click', () => {
    $('cover').classList.add('hide');
    for (let i = 0; i < 25; i++) setTimeout(() => spawn(true), i * 60);
    setInterval(spawn, 900);
  });

  $('surpriseBtn').addEventListener('click', () => {
    $('final').textContent = messageVoeu;
    for (let i = 0; i < 50; i++) setTimeout(() => spawn(true), i * 50);
  });
</script>

</body>
</html>
